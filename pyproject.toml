[project]
name = "synthesizability"
version = "1.0.0.dev0"
description = "Data and analysis for the arc-melting test of 34 predicted ternary compounds (Hamlin group, University of Florida)"
authors = [{ name = "James J. Hamlin" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
# Core: everything the default (offline) pipeline needs to rebuild the tables and figures
# from the deposited data.
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=2.3,<3",
    "scipy>=1.15,<2",
    "matplotlib>=3.10,<4",
    "pymatgen>=2025.10.7",
    "adjustText>=1.3,<2",   # label placement in Fig. 2
    "snakemake>=9.16,<10",
]

[project.optional-dependencies]
# P_disorder from the Jakob et al. classifier (CPU is enough for 34 formulas).
# elementembeddings is pinned: the 0.6.2 wheel ships without its data/ directory and the
# classifier then fails every formula without raising.
disorder = [
    "torch>=2.4",
    "pandarallel>=1.6.5,<2",
    "elementembeddings==0.6.1",
]
# Dynamical stability (MatterSim-v1.0.0-5M + phonopy), about 40 CPU-minutes in total.
phonons = [
    "torch>=2.4",
    "mattersim>=1.2,<2",
    "phonopy>=2.30",
    "ase>=3.23",
    "seekpath>=2.1",
]
# Re-refining the deposited GSAS-II projects. GSAS-II itself is not on PyPI under a
# stable name; install it separately (see README, "GSAS-II"). These are the Python
# packages it needs to read CIFs and report its version.
rietveld = [
    "pycifrw>=4.4",
    "gitpython>=3.1",
]
# Refreshing the database snapshot (needs a Materials Project API key and, for OQMD, a
# local copy of the OQMD database).
refresh = [
    "mp-api>=0.45",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow/src/synthesizability"]

# torch from the CPU-only index: the default PyPI wheels pull several GB of CUDA
# libraries that this analysis does not use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
